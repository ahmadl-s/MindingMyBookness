spring:
  application:
    name: MindingMyBookness
  datasource:
    url: jdbc:postgresql://localhost:5432/mindingmybookness_database
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
    port: 8090

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}